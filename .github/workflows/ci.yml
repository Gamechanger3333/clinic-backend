name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "**"
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clinicflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clinicflow_test
      ACCESS_TOKEN_SECRET: ci-test-access-secret-please-rotate
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-please-rotate
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit/security test suite (DB-free)
        run: npm test

      - name: Push schema to test database
        run: npx prisma db push

      - name: Run DB-integration test suite
        run: npm run test:integration
